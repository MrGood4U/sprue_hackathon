# Combine with compose.db.yml. Migration is an explicit one-off profile, not startup behavior.
x-backend-environment: &backend-environment
  NODE_ENV: development
  DEPLOYMENT_ENVIRONMENT: local
  HOST: 0.0.0.0
  PORT: 3001
  WORKER_PORT: 3002
  DATABASE_URL: ${CONTAINER_DATABASE_URL:?Set a URL for the postgres Compose hostname}
  DATABASE_SSL_MODE: disable
  API_BASE_URL: http://127.0.0.1:3001
  CONSOLE_PUBLIC_URL: http://127.0.0.1:4173
  DATA_PUBLIC_BASE_URL: http://127.0.0.1:3001/data/v1
  CORS_ALLOWED_ORIGINS: http://127.0.0.1:4173
services:
  api:
    build: .
    environment:
      <<: *backend-environment
      PRIVY_APP_ID: ${PRIVY_APP_ID:-}
      PRIVY_APP_SECRET: ${PRIVY_APP_SECRET:-}
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
  worker:
    build: .
    command: ["node", "dist/src/app/worker.js"]
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
  migrate:
    build: .
    profiles: ["tools"]
    command: ["node", "dist/scripts/migrate.js"]
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
