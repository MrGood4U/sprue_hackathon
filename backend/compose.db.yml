name: sprue-database
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: sprue
      POSTGRES_USER: sprue
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local-only POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - sprue-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sprue -d sprue"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  sprue-postgres-data:
